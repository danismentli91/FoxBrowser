name: Build Android APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: FoxBrowser-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish FoxBrowser v1.01
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FoxBrowser-v1.01.apk
          gh release view v1.01 >/dev/null 2>&1 || gh release create v1.01 --target "$GITHUB_SHA" --title "FoxBrowser v1.01" --notes "Chrome benzeri kategorili ayarlar, ayarlarda arama, kalıcı FoxTerminal oturumu ve Termux komut köprüsü."
          gh release upload v1.01 FoxBrowser-v1.01.apk --clobber
